<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile | CareQueue</title><link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"><link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet"><link href="/css/hospital.css" rel="stylesheet"><style>.profile-wrap{max-width:760px}.profile-hero{background:linear-gradient(120deg,#153b48,#087e80);border-radius:18px;color:#fff;padding:28px}.profile-card{border:0;border-radius:16px;box-shadow:0 8px 28px #193b4812}.form-label{font-size:13px;font-weight:650}</style></head><body>
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="/patient-dashboard.html"><i class="bi bi-heart-pulse text-primary me-2"></i>CareQueue</a><a href="/patient-dashboard.html" class="btn btn-sm btn-outline-secondary">Back to dashboard</a></div></nav>
<main class="container profile-wrap py-4"><div class="profile-hero mb-4"><span class="small text-uppercase opacity-75">YOUR ACCOUNT</span><h1 class="h3 fw-bold mt-2 mb-1">Personal profile</h1><p class="mb-0 opacity-75">Keep your contact and health details up to date for appointments.</p></div><form id="profile-form" class="card profile-card p-4"><div id="profile-message" class="d-none alert"></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="profile-name">Full name</label><input id="profile-name" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="profile-email">Email address</label><input id="profile-email" class="form-control" disabled></div><div class="col-md-6"><label class="form-label" for="profile-phone">Phone number</label><input id="profile-phone" class="form-control" type="tel" required></div><div class="col-md-3"><label class="form-label" for="profile-age">Age</label><input id="profile-age" class="form-control" type="number" min="1" max="120"></div><div class="col-md-3"><label class="form-label" for="profile-gender">Gender</label><select id="profile-gender" class="form-select"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div><div class="col-md-4"><label class="form-label" for="profile-blood">Blood group</label><select id="profile-blood" class="form-select"><option value="">Not set</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div><div class="col-md-8"><label class="form-label" for="profile-allergies">Allergies or health notes</label><input id="profile-allergies" class="form-control" placeholder="Optional"></div></div><div class="d-flex justify-content-end mt-4"><button id="save-profile" class="btn btn-primary px-4"><i class="bi bi-check2 me-1"></i>Save profile</button></div></form></main>
<script>const form=document.getElementById('profile-form'),message=document.getElementById('profile-message');async function loadProfile(){const res=await fetch('/api/me');if(!res.ok)return location.assign('/login.html');const u=(await res.json()).user;for(const [id,key] of Object.entries({'profile-name':'name','profile-email':'email','profile-phone':'phone','profile-age':'age','profile-gender':'gender','profile-blood':'blood_group','profile-allergies':'allergies'}))document.getElementById(id).value=u[key]||'';}form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('save-profile');button.disabled=true;try{const body={name:document.getElementById('profile-name').value.trim(),phone:document.getElementById('profile-phone').value.trim(),age:document.getElementById('profile-age').value,gender:document.getElementById('profile-gender').value,blood_group:document.getElementById('profile-blood').value,allergies:document.getElementById('profile-allergies').value.trim()};const res=await fetch('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await res.json();if(!res.ok)throw Error(result.message);message.textContent=result.message;message.className='alert alert-success';}catch(err){message.textContent=err.message;message.className='alert alert-danger';}finally{button.disabled=false;}});loadProfile();</script></body></html>
